<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Study on How People Evaluate New Home Products</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f1f3f4; color: #202124; margin: 0; }
  main { max-width: 640px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 8px; }
  h1 { font-size: 22px; font-weight: normal; margin: 0 0 16px; }
  a { color: #1a73e8; }
</style>
</head>
<body>
<main>
  <h1>Study on How People Evaluate New Home Products</h1>
  <p id="msg">Opening the questionnaire. Please wait a moment&hellip;</p>
  <noscript><p>Please <a href="https://script.google.com/macros/s/AKfycbwI5GGoF-IeViAdH1LLxAfO1ie6VoNp3POpnfFcc5e5Sv9PkyEBc5RrTqWIAPSXVkVS/exec">click here</a> to start.</p></noscript>
</main>
<script>
  // The Google Apps Script web app picks one of the three forms at random
  // (1/3 chance each) and returns its link. This page only passes it on.
  var API = 'https://script.google.com/macros/s/AKfycbwI5GGoF-IeViAdH1LLxAfO1ie6VoNp3POpnfFcc5e5Sv9PkyEBc5RrTqWIAPSXVkVS/exec';
  var KEY = 'orvynStudyFormUrl';
  var FORM_LINK = /^https:\/\/docs\.google\.com\/forms\/d\/e\/[\w-]+\/viewform$/;
  var msg = document.getElementById('msg');
  var done = false;

  function go(url) {
    done = true;
    msg.innerHTML = 'If the questionnaire does not open, please <a href="' + url + '">click here</a>.';
    window.location.replace(url);
  }

  function backup() {
    if (done) return;
    done = true;
    msg.innerHTML = 'Please <a href="' + API + '">click here</a> to start the questionnaire.';
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}

  if (saved && FORM_LINK.test(saved)) {
    go(saved); // same browser, same form as before
  } else {
    setTimeout(backup, 15000);
    fetch(API + '?mode=json', { credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (done) return;
        if (!d || !FORM_LINK.test(d.url)) { backup(); return; }
        try { localStorage.setItem(KEY, d.url); } catch (e) {}
        go(d.url);
      })
      .catch(backup);
  }
</script>
</body>
</html>
